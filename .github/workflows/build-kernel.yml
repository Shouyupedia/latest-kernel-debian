name: Build Debian Linux Kernel

on:
  workflow_dispatch:
  schedule:
    # GitHub schedules use UTC. Keep an off-peak minute and check every 3 hours.
    - cron: "28 */3 * * *"

permissions:
  contents: read

concurrency:
  group: build-debian-kernel
  cancel-in-progress: false

env:
  KERNEL_REPO: https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
  BBR3_REPO: https://github.com/CachyOS/linux.git
  DEBIAN_CONFIG_REPO: https://salsa.debian.org/kernel-team/linux.git
  DEBIAN_CONFIG_REF: debian/latest
  DEBIAN_FRONTEND: noninteractive
  # Primary key fingerprints that sign Linux mainline and stable tags:
  # Linus Torvalds, Greg Kroah-Hartman and Sasha Levin (kernel.org).
  KERNEL_TAG_SIGNERS: >-
    ABAF11C65A2970B130ABE3C479BE3E4300411886
    647F28654894E3BD457199BE38DBBDC86092693E
    E27E5D8A3403A2EF66873BBCDEA66FF797772CDC
  # GitHub Release tag that hosts the signed APT index (a flat repository).
  APT_SUITE: apt

jobs:
  check:
    name: Sync configs and check kernel source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      bbr3_base: ${{ steps.bbr3-source.outputs.base }}
      bbr3_branch: ${{ steps.bbr3-source.outputs.branch }}
      bbr3_commit_count: ${{ steps.bbr3-source.outputs.commit_count }}
      bbr3_tip: ${{ steps.bbr3-source.outputs.tip }}
      config_commit: ${{ steps.configs.outputs.config_commit }}
      configs_changed: ${{ steps.configs.outputs.configs_changed }}
      existing_kernel_release: ${{ steps.version.outputs.existing_kernel_release }}
      existing_release_tag: ${{ steps.version.outputs.existing_release_tag }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      release_target: ${{ steps.configs.outputs.release_target }}
      should_build: ${{ steps.version.outputs.should_build }}
      source_commit: ${{ steps.version.outputs.source_commit }}
      source_tag: ${{ steps.version.outputs.source_tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Fetch and update Debian cloud configs
        id: configs
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          config_repo=/tmp/debian-kernel-config

          git clone \
            --depth=1 \
            --filter=blob:none \
            --sparse \
            --single-branch \
            --branch "$DEBIAN_CONFIG_REF" \
            "$DEBIAN_CONFIG_REPO" \
            "$config_repo"
          git -C "$config_repo" sparse-checkout set --no-cone \
            /debian/config/config \
            /debian/config/amd64/config \
            /debian/config/config.cloud \
            /debian/config/amd64/config.cloud-amd64

          base_config="$config_repo/debian/config/config"
          amd64_base_config="$config_repo/debian/config/amd64/config"
          common_config="$config_repo/debian/config/config.cloud"
          amd64_config="$config_repo/debian/config/amd64/config.cloud-amd64"
          snapshot_dir="$RUNNER_TEMP/kernel-configs"

          validate_fragment() {
            local file="$1"
            local name="$2"
            local minimum_bytes="$3"
            local minimum_settings="$4"
            local bytes
            local settings

            if [[ ! -s "$file" ]]; then
              echo "::error::$name is missing or empty"
              return 1
            fi

            bytes="$(wc -c < "$file")"
            settings="$(
              grep -Ec '^(CONFIG_[A-Z0-9_]+=|# CONFIG_[A-Z0-9_]+ is not set$)' \
                "$file" || true
            )"

            if ((bytes < minimum_bytes || settings < minimum_settings)); then
              echo "::error::$name failed validation: ${bytes} bytes, ${settings} settings"
              return 1
            fi
          }

          validate_fragment "$base_config" config 10000 100
          validate_fragment "$amd64_base_config" config.amd64 500 5
          validate_fragment "$common_config" config.cloud 10000 100
          validate_fragment "$amd64_config" config.cloud-amd64 500 10

          mkdir -p "$snapshot_dir"
          install -m 0644 "$base_config" "$snapshot_dir/config.debian"
          install -m 0644 "$amd64_base_config" "$snapshot_dir/config.amd64"
          install -m 0644 "$common_config" "$snapshot_dir/config.cloud"
          install -m 0644 "$amd64_config" "$snapshot_dir/config.cloud-amd64"
          install -m 0644 "$GITHUB_WORKSPACE/config.vps" "$snapshot_dir/config.vps"

          install -m 0644 "$common_config" "$GITHUB_WORKSPACE/config.cloud"
          install -m 0644 "$amd64_config" "$GITHUB_WORKSPACE/config.cloud-amd64"

          config_commit="$(git -C "$config_repo" rev-parse HEAD)"
          configs_changed=false
          if ! git diff --quiet -- config.cloud config.cloud-amd64; then
            configs_changed=true
            git diff --stat -- config.cloud config.cloud-amd64
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add config.cloud config.cloud-amd64
            git commit -m "chore: update Debian cloud kernel configs [skip ci]"
            # A concurrent push to the default branch must not fail the whole
            # scheduled run. actions/checkout is shallow, so a rebase is not
            # possible; reset onto the current remote tip and re-apply the two
            # config files instead.
            pushed=false
            for attempt in 1 2 3; do
              if git push origin "HEAD:${DEFAULT_BRANCH}"; then
                pushed=true
                break
              fi
              echo "::warning::Config push attempt ${attempt} failed; re-applying onto ${DEFAULT_BRANCH}"
              sleep "$((attempt * 3))"
              git fetch --depth=1 origin "$DEFAULT_BRANCH"
              git reset --hard FETCH_HEAD
              install -m 0644 "$common_config" "$GITHUB_WORKSPACE/config.cloud"
              install -m 0644 "$amd64_config" "$GITHUB_WORKSPACE/config.cloud-amd64"
              if git diff --quiet -- config.cloud config.cloud-amd64; then
                echo "Debian cloud configs were already updated by a concurrent run."
                pushed=true
                configs_changed=false
                break
              fi
              git add config.cloud config.cloud-amd64
              git commit -m "chore: update Debian cloud kernel configs [skip ci]"
            done
            if [[ "$pushed" != true ]]; then
              echo "::error::Could not push the updated Debian cloud configs"
              exit 1
            fi
          else
            echo "Debian cloud configs are already up to date."
          fi

          {
            echo "config_commit=$config_commit"
            echo "configs_changed=$configs_changed"
            echo "release_target=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Debian cloud config sync"
            echo
            echo "- Source ref: \`$DEBIAN_CONFIG_REF\`"
            echo "- Source commit: \`$config_commit\`"
            echo "- Repository files changed: \`$configs_changed\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Determine whether the kernel source changed
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # One listing serves every tag lookup in this job; it already
          # contains the peeled ^{} commit of each annotated tag.
          kernel_tags="$RUNNER_TEMP/kernel-tags.txt"
          git ls-remote --tags "$KERNEL_REPO" > "$kernel_tags"
          latest_tag="$(
            awk '{print $2}' "$kernel_tags" \
              | sed 's#refs/tags/##' \
              | grep -Ev '\^\{\}|-rc' \
              | grep -E '^v[0-9]+\.[0-9]+(\.[0-9]+)?$' \
              | sort -V \
              | tail -n 1
          )"

          if ! [[ "$latest_tag" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Unexpected tag format: '$latest_tag'"
            exit 1
          fi

          source_commit="$(
            awk -v ref="refs/tags/${latest_tag}" '
              $2 == ref "^{}" { print $1; found=1; exit }
              $2 == ref { fallback=$1 }
              END { if (!found && fallback) print fallback }
            ' "$kernel_tags"
          )"
          if ! [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve source commit for $latest_tag"
            exit 1
          fi

          source_version="${latest_tag#v}"
          version="$source_version"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+$ ]]; then
            version="${version}.0"
          fi
          release_tag="v${version}-shouyu"
          existing_release=""
          existing_kernel_release=""
          declare -A candidate_releases=()
          declare -A candidate_kernel_releases=()
          declare -A release_images=()
          declare -A release_headers=()
          declare -a candidate_order=()

          release_assets_file="$RUNNER_TEMP/release-assets.tsv"
          if ! gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '
              .[]
              | select(.draft == false and .prerelease == false)
              | .tag_name as $tag
              | (
                  [$tag, ""]
                  | @tsv
                ),
                (
                  .assets[]?
                  | select(.state == "uploaded")
                  | [$tag, .name]
                  | @tsv
                )
            ' > "$release_assets_file"; then
            echo "::error::Could not query existing Releases"
            exit 1
          fi

          while IFS=$'\t' read -r published_tag asset_name; do
            matches_source=false
            package_release=""

            if [[ "$published_tag" == "$release_tag" ]]; then
              matches_source=true
              package_release="${version}-shouyu"
            elif [[ "$published_tag" == "$latest_tag" ]]; then
              matches_source=true
              package_release="$version"
            elif [[ "$published_tag" =~ ^v([0-9]+\.[0-9]+(\.[0-9]+)?)(-(shouyu|cloud))?-[0-9]+$ ]]; then
              published_version="${BASH_REMATCH[1]}"
              published_suffix="${BASH_REMATCH[3]}"
              if [[ "$published_version" =~ ^[0-9]+\.[0-9]+$ ]]; then
                published_version="${published_version}.0"
              fi
              if [[ "$published_version" == "$version" ]]; then
                matches_source=true
                package_release="$version$published_suffix"
              fi
            fi

            [[ "$matches_source" == true ]] || continue
            if [[ ! ${candidate_releases["$published_tag"]+present} ]]; then
              candidate_order+=("$published_tag")
            fi
            candidate_releases["$published_tag"]=1
            candidate_kernel_releases["$published_tag"]="$package_release"
            if [[ "$asset_name" == \
              "linux-image-${package_release}_${package_release}-1_amd64.deb" ]]; then
              release_images["$published_tag"]=1
            elif [[ "$asset_name" == \
              "linux-headers-${package_release}_${package_release}-1_amd64.deb" ]]; then
              release_headers["$published_tag"]=1
            fi
          done < "$release_assets_file"

          complete_release() {
            local candidate="$1"
            [[ ${release_images["$candidate"]+present} \
              && ${release_headers["$candidate"]+present} ]]
          }

          if [[ ${candidate_releases["$release_tag"]+present} ]]; then
            if complete_release "$release_tag"; then
              existing_release="$release_tag"
            fi
          elif complete_release "$latest_tag"; then
            existing_release="$latest_tag"
          else
            for published_tag in "${candidate_order[@]}"; do
              if complete_release "$published_tag"; then
                existing_release="$published_tag"
                break
              fi
            done
          fi

          if [[ -n "$existing_release" ]]; then
            existing_kernel_release="${candidate_kernel_releases[$existing_release]}"
          fi

          should_build=true
          if [[ -n "$existing_release" ]]; then
            should_build=false
            echo "Kernel source $latest_tag was already built in release $existing_release."
          else
            echo "Kernel source $latest_tag is new and will be built as $release_tag."
          fi

          {
            echo "source_tag=$latest_tag"
            echo "source_commit=$source_commit"
            echo "version=$version"
            echo "release_tag=$release_tag"
            echo "existing_release_tag=$existing_release"
            echo "existing_kernel_release=$existing_kernel_release"
            echo "should_build=$should_build"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Kernel source check"
            echo
            echo "- Latest stable source: \`$latest_tag\`"
            echo "- Source commit: \`$source_commit\`"
            echo "- New Release tag: \`$release_tag\`"
            echo "- Existing complete Release: \`${existing_release:-none}\`"
            echo "- Build required: \`$should_build\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve BBRv3 source
        id: bbr3-source
        if: steps.version.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          kernel_series="$(cut -d. -f1,2 <<< "$VERSION")"
          series_tag="v${kernel_series}"
          branch="${kernel_series}/bbr3"
          tip="$(
            git ls-remote --heads "$BBR3_REPO" "refs/heads/$branch" \
              | awk 'NR == 1 { print $1 }'
          )"

          if ! [[ "$tip" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::BBRv3 branch not found: $branch"
            exit 1
          fi

          # Supply-chain gate: only a tip that a maintainer has reviewed and
          # recorded in bbr3-pin.txt may be built. CachyOS force-pushes these
          # topic branches, so without this anchor any upstream move would ship
          # to every user within three hours with nobody having looked at it.
          pin_file="$GITHUB_WORKSPACE/bbr3-pin.txt"
          if [[ ! -s "$pin_file" ]]; then
            echo "::error::Missing BBRv3 pin file: bbr3-pin.txt"
            exit 1
          fi
          pinned_tip=""
          pin_branch=""
          while read -r pin_branch pin_sha _ || [[ -n "$pin_branch" ]]; do
            # Tolerate a CRLF pin file edited on Windows.
            pin_branch="${pin_branch%$'\r'}"
            pin_sha="${pin_sha:-}"
            pin_sha="${pin_sha%$'\r'}"
            [[ -n "$pin_branch" ]] || continue
            [[ "$pin_branch" != \#* ]] || continue
            if [[ "$pin_branch" == "$branch" ]]; then
              pinned_tip="${pin_sha:-}"
              break
            fi
          done < "$pin_file"

          bbr3_web="${BBR3_REPO%.git}"
          if ! [[ "$pinned_tip" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::bbr3-pin.txt has no reviewed pin for ${branch}. Review ${bbr3_web}/commits/${branch} and add the line '${branch} ${tip}' to bbr3-pin.txt."
            exit 1
          fi
          if [[ "$pinned_tip" != "$tip" ]]; then
            echo "::error::BBRv3 branch ${branch} moved past the reviewed pin. Review ${bbr3_web}/compare/${pinned_tip}...${tip} and, once the diff is confirmed to be BBRv3-only, update bbr3-pin.txt to '${branch} ${tip}'."
            exit 1
          fi
          echo "BBRv3 topic tip matches the reviewed pin: $pinned_tip"

          # Compare the topic tip with the matching mainline release through
          # GitHub's API. This pins the short, unique topic chain without
          # downloading thousands of unrelated commits from both repositories.
          series_commit="$(
            awk -v ref="refs/tags/${series_tag}" '
              $2 == ref "^{}" { print $1; found=1; exit }
              $2 == ref { fallback=$1 }
              END { if (!found && fallback) print fallback }
            ' "$RUNNER_TEMP/kernel-tags.txt"
          )"
          if ! [[ "$series_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve mainline series tag $series_tag"
            exit 1
          fi

          bbr3_repository="${BBR3_REPO#https://github.com/}"
          bbr3_repository="${bbr3_repository%.git}"
          if ! [[ "$bbr3_repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::Unexpected BBRv3 repository URL: $BBR3_REPO"
            exit 1
          fi

          comparison="$RUNNER_TEMP/bbr3-comparison.json"
          if ! gh api \
            --method GET \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -f per_page=100 \
            "repos/$bbr3_repository/compare/$series_commit...$tip" \
            > "$comparison"; then
            echo "::error::Could not compare the BBRv3 topic branch"
            exit 1
          fi

          status="$(jq -r '.status // empty' "$comparison")"
          requested_base="$(jq -r '.base_commit.sha // empty' "$comparison")"
          base="$(jq -r '.merge_base_commit.sha // empty' "$comparison")"
          ahead_by="$(jq -r '.ahead_by // empty' "$comparison")"
          total_commits="$(jq -r '.total_commits // empty' "$comparison")"
          commit_count="$(jq -r '.commits | length' "$comparison")"

          if [[ "$status" != "ahead" && "$status" != "diverged" ]]; then
            echo "::error::Unexpected BBRv3 comparison status: $status"
            exit 1
          fi
          if [[ "$requested_base" != "$series_commit" ]]; then
            echo "::error::BBRv3 comparison base does not match the requested commit"
            exit 1
          fi
          if ! [[ "$base" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid BBRv3 topic base"
            exit 1
          fi
          if ! [[ "$ahead_by" =~ ^[0-9]+$ &&
                  "$total_commits" =~ ^[0-9]+$ &&
                  "$commit_count" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid BBRv3 topic commit counts"
            exit 1
          fi
          if ((commit_count == 0 || commit_count > 64 ||
              ahead_by != commit_count || total_commits != commit_count)); then
            echo "::error::Unexpected BBRv3 topic series size"
            exit 1
          fi

          previous="$base"
          for ((index = 0; index < commit_count; index++)); do
            commit="$(jq -r ".commits[$index].sha // empty" "$comparison")"
            parent_count="$(jq -r ".commits[$index].parents | length" "$comparison")"
            parent="$(jq -r ".commits[$index].parents[0].sha // empty" "$comparison")"
            if ! [[ "$commit" =~ ^[0-9a-f]{40}$ &&
                    "$parent" =~ ^[0-9a-f]{40}$ &&
                    "$parent_count" == "1" ]]; then
              echo "::error::BBRv3 topic history is not linear"
              exit 1
            fi
            if [[ "$parent" != "$previous" ]]; then
              echo "::error::BBRv3 comparison returned a discontinuous topic chain"
              exit 1
            fi
            previous="$commit"
          done
          if [[ "$previous" != "$tip" ]]; then
            echo "::error::BBRv3 comparison tip does not match the advertised branch"
            exit 1
          fi

          {
            echo "base=$base"
            echo "branch=$branch"
            echo "commit_count=$commit_count"
            echo "tip=$tip"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### BBRv3 source"
            echo
            echo "- Branch: \`$branch\`"
            echo "- Reviewed pin: \`${pinned_tip:0:12}\`"
            echo "- Topic base: \`${base:0:12}\`"
            echo "- Topic commits: \`$commit_count\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload kernel config snapshot
        if: steps.version.outputs.should_build == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kernel-configs-${{ github.run_id }}
          path: ${{ runner.temp }}/kernel-configs/*
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  repair-existing-release:
    name: Normalize existing Release
    needs: check
    if: needs.check.outputs.should_build == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Normalize metadata and assets without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          KERNEL_RELEASE: ${{ needs.check.outputs.existing_kernel_release }}
          RELEASE_TAG: ${{ needs.check.outputs.existing_release_tag }}
        run: |
          set -euo pipefail

          valid_identity=false
          if [[ "$KERNEL_RELEASE" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?(-(shouyu|cloud))?$ \
            && "$RELEASE_TAG" == "v${KERNEL_RELEASE}" ]]; then
            valid_identity=true
          elif [[ "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+(\.[0-9]+)?)(-(shouyu|cloud))?-[0-9]+$ ]]; then
            legacy_release="${BASH_REMATCH[1]}${BASH_REMATCH[3]}"
            [[ "$KERNEL_RELEASE" == "$legacy_release" ]] \
              && valid_identity=true
          fi
          if [[ "$valid_identity" != true ]]; then
            echo "::error::Unsafe existing Release identity"
            exit 1
          fi

          release_json="$RUNNER_TEMP/existing-release.json"
          if ! gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            > "$release_json"; then
            echo "::error::Could not read existing Release $RELEASE_TAG"
            exit 1
          fi
          if ! jq -e '
            .draft == false
            and .prerelease == false
            and (.id | type == "number")
          ' "$release_json" >/dev/null; then
            echo "::error::Existing Release is not a published final Release"
            exit 1
          fi
          release_id="$(jq -er '.id' "$release_json")"

          assets_file="$RUNNER_TEMP/existing-assets.tsv"
          if ! gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
            --jq '
              .[]
              | [
                  (.id | tostring),
                  .name,
                  .state,
                  (.digest // ""),
                  (.size | tostring),
                  .created_at
                ]
              | @tsv
            ' > "$assets_file"; then
            echo "::error::Could not read existing Release assets"
            exit 1
          fi

          declare -A asset_id=()
          declare -A asset_name=()
          declare -A asset_digest=()
          declare -A asset_size=()
          declare -A asset_created=()
          declare -a extra_asset_ids=()

          while IFS=$'\t' read -r id name state digest size created_at; do
            kind=""
            case "$name" in
              "linux-image-${KERNEL_RELEASE}_${KERNEL_RELEASE}-1_amd64.deb")
                kind=image
                ;;
              "linux-headers-${KERNEL_RELEASE}_${KERNEL_RELEASE}-1_amd64.deb")
                kind=headers
                ;;
              *)
                extra_asset_ids+=("$id")
                continue
                ;;
            esac

            if [[ "$state" != "uploaded" \
              || ! "$name" =~ ^linux-(image|headers)-[A-Za-z0-9.+~-]+_[A-Za-z0-9.+:~-]+_amd64\.deb$ \
              || ! "$size" =~ ^[1-9][0-9]*$ \
              || ${asset_id["$kind"]+present} ]]; then
              echo "::error::Invalid or duplicate $kind asset in $RELEASE_TAG"
              exit 1
            fi
            asset_id["$kind"]="$id"
            asset_name["$kind"]="$name"
            asset_digest["$kind"]="$digest"
            asset_size["$kind"]="$size"
            asset_created["$kind"]="$created_at"
          done < "$assets_file"

          for kind in image headers; do
            if [[ ! ${asset_id["$kind"]+present} ]]; then
              echo "::error::Existing Release is missing its $kind package"
              exit 1
            fi
          done

          existing_body="$(jq -r '.body // ""' "$release_json")"
          build_time="$(
            grep -Eo -m 1 \
              '[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z' \
              <<< "$existing_body" \
              || true
          )"
          if [[ -z "$build_time" ]]; then
            build_time="${asset_created[image]}"
            if [[ "${asset_created[headers]}" < "$build_time" ]]; then
              build_time="${asset_created[headers]}"
            fi
          fi
          if ! [[ "$build_time" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]; then
            echo "::error::Could not determine the original UTC build time"
            exit 1
          fi

          notes_file="$RUNNER_TEMP/release.md"
          printf 'Version: `%s`\n\nBuild time: `%s`\n' \
            "$KERNEL_RELEASE" \
            "$build_time" \
            > "$notes_file"
          expected_body="$(cat "$notes_file")"

          # This job runs on every scheduled check without a new kernel. Leave
          # an already normalized Release untouched instead of rewriting its
          # notes and assets every three hours.
          already_normalized=true
          for kind in image headers; do
            [[ "${asset_digest[$kind]}" =~ ^sha256:[0-9a-f]{64}$ ]] \
              || already_normalized=false
          done
          ((${#extra_asset_ids[@]} == 0)) || already_normalized=false
          [[ "$(jq -r '.name // ""' "$release_json")" == "$KERNEL_RELEASE" \
            && "$existing_body" == "$expected_body" ]] \
            || already_normalized=false
          latest_tag="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name' \
              2>/dev/null || true
          )"
          [[ "$latest_tag" == "$RELEASE_TAG" ]] || already_normalized=false
          if [[ "$already_normalized" == true ]]; then
            echo "Release $RELEASE_TAG is already normalized; nothing to change."
            exit 0
          fi

          # Older GitHub assets may predate server-side digests. Refresh only
          # those assets from their already-published bytes; no kernel rebuild
          # is performed.
          refresh_dir="$RUNNER_TEMP/release-refresh"
          mkdir -p "$refresh_dir"
          for kind in image headers; do
            [[ "${asset_digest[$kind]}" =~ ^sha256:[0-9a-f]{64}$ ]] && continue

            package_path="$refresh_dir/${asset_name[$kind]}"
            if ! gh api \
              -H "Accept: application/octet-stream" \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id[$kind]}" \
              > "${package_path}.part"; then
              echo "::error::Could not download the existing $kind asset"
              exit 1
            fi
            mv "${package_path}.part" "$package_path"

            package="$(dpkg-deb -f "$package_path" Package)"
            version="$(dpkg-deb -f "$package_path" Version)"
            architecture="$(dpkg-deb -f "$package_path" Architecture)"
            expected_package="linux-${kind}-${KERNEL_RELEASE}"
            if [[ "$package" != "$expected_package" ]]; then
              echo "::error::Unexpected package name in existing $kind asset"
              exit 1
            fi
            if [[ "$version" != "${KERNEL_RELEASE}-1" || "$architecture" != "amd64" ]]; then
              echo "::error::Unexpected package metadata in existing $kind asset"
              exit 1
            fi
            actual_size="$(stat -c '%s' "$package_path")"
            if [[ "$actual_size" != "${asset_size[$kind]}" ]]; then
              echo "::error::Existing $kind asset size changed during download"
              exit 1
            fi

            gh api \
              --method DELETE \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id[$kind]}"
            gh release upload \
              "$RELEASE_TAG" \
              "$package_path" \
              --repo "$GITHUB_REPOSITORY"
          done

          # Expected packages are confirmed before obsolete README/old package
          # assets are removed.
          for asset_id_to_delete in "${extra_asset_ids[@]}"; do
            gh api \
              --method DELETE \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id_to_delete}"
          done

          gh release edit \
            "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$KERNEL_RELEASE" \
            --notes-file "$notes_file" \
            --draft=false \
            --prerelease=false \
            --latest

          final_release_json="$RUNNER_TEMP/final-release.json"
          final_assets_file="$RUNNER_TEMP/final-assets.tsv"
          verified=false
          for attempt in 1 2 3 4 5; do
            if ! gh api \
              "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
              > "$final_release_json"; then
              echo "::error::Could not verify normalized Release"
              exit 1
            fi
            final_release_id="$(jq -er '.id' "$final_release_json")"
            if ! gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/releases/${final_release_id}/assets?per_page=100" \
              --jq '
                .[]
                | [
                    .name,
                    .state,
                    (.digest // ""),
                    (.size | tostring)
                  ]
                | @tsv
              ' > "$final_assets_file"; then
              echo "::error::Could not verify normalized Release assets"
              exit 1
            fi

            actual_name="$(jq -r '.name // ""' "$final_release_json")"
            actual_body="$(jq -r '.body // ""' "$final_release_json")"
            release_state_valid=false
            if jq -e --arg tag "$RELEASE_TAG" '
              .tag_name == $tag
              and .draft == false
              and .prerelease == false
            ' "$final_release_json" >/dev/null; then
              release_state_valid=true
            fi
            mapfile -t final_assets < "$final_assets_file"
            assets_valid=true
            if ((${#final_assets[@]} != 2)); then
              assets_valid=false
            else
              found_image=false
              found_headers=false
              for record in "${final_assets[@]}"; do
                IFS=$'\t' read -r name state digest size <<< "$record"
                case "$name" in
                  "linux-image-${KERNEL_RELEASE}_${KERNEL_RELEASE}-1_amd64.deb")
                    found_image=true
                    ;;
                  "linux-headers-${KERNEL_RELEASE}_${KERNEL_RELEASE}-1_amd64.deb")
                    found_headers=true
                    ;;
                  *)
                    assets_valid=false
                    ;;
                esac
                if [[ "$state" != "uploaded" \
                  || ! "$digest" =~ ^sha256:[0-9a-f]{64}$ \
                  || ! "$size" =~ ^[1-9][0-9]*$ ]]; then
                  assets_valid=false
                fi
              done
              [[ "$found_image" == true && "$found_headers" == true ]] \
                || assets_valid=false
            fi

            if [[ "$actual_name" == "$KERNEL_RELEASE" \
              && "$actual_body" == "$expected_body" \
              && "$release_state_valid" == true \
              && "$assets_valid" == true ]]; then
              verified=true
              break
            fi
            sleep "$((attempt * 2))"
          done
          [[ "$verified" == true ]] \
            || { echo "::error::Normalized Release verification failed"; exit 1; }

  build:
    name: Build ${{ needs.check.outputs.source_tag }}
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      build_time: ${{ steps.metadata.outputs.build_time }}
      kernel_release: ${{ steps.krel.outputs.release }}
    permissions:
      contents: read
    env:
      # A defined LOCALVERSION suppresses the SCM "+" added after the BBRv3
      # commits, while remaining inherited by bindeb-pkg's recursive make.
      LOCALVERSION: "-shouyu"
      # Stable identity for /proc/version and the package Maintainer field
      # instead of the ephemeral runner hostname.
      KBUILD_BUILD_USER: shouyu
      KBUILD_BUILD_HOST: github-actions
      DEBFULLNAME: Kernel Builder
      DEBEMAIL: kernel-builder@users.noreply.github.com

    steps:
      - name: Notify Telegram that the build started
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
          SOURCE_TAG: ${{ needs.check.outputs.source_tag }}
          TARGET_VERSION: ${{ needs.check.outputs.version }}-shouyu
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ -z "${TELEGRAM_BOT_TOKEN:-}" || -z "${TELEGRAM_CHAT_ID:-}" ]]; then
            echo "Telegram notification skipped: TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not configured." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          request=(
            --fail-with-body
            --silent
            --connect-timeout 5
            --max-time 20
            --retry 2
            --retry-delay 1
            --retry-connrefused
            --request POST
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID"
          )
          if [[ -n "${TELEGRAM_MESSAGE_THREAD_ID:-}" ]]; then
            if ! [[ "$TELEGRAM_MESSAGE_THREAD_ID" =~ ^[1-9][0-9]*$ ]]; then
              echo "::warning::TELEGRAM_MESSAGE_THREAD_ID must be a positive integer"
              exit 0
            fi
          fi

          message="$(printf \
            '发现新的 Linux stable 内核：%s\n目标版本：%s\n状态：已开始编译\n运行记录：%s' \
            "$SOURCE_TAG" "$TARGET_VERSION" "$RUN_URL")"
          request+=(--data-urlencode "text=$message")
          send_request=("${request[@]}")
          if [[ -n "${TELEGRAM_MESSAGE_THREAD_ID:-}" ]]; then
            send_request+=(--data-urlencode "message_thread_id=$TELEGRAM_MESSAGE_THREAD_ID")
          fi

          response="$RUNNER_TEMP/telegram-response.json"
          telegram_url="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
          if curl "${send_request[@]}" --output "$response" "$telegram_url"; then
            exit 0
          fi

          description="$(jq -r '.description // empty' "$response" 2>/dev/null || true)"
          if [[ -n "${TELEGRAM_MESSAGE_THREAD_ID:-}" ]]; then
            echo "::warning::Telegram topic notification failed: ${description:-no API description}; retrying without message_thread_id"
            if curl "${request[@]}" --output "$response" "$telegram_url"; then
              exit 0
            fi
            description="$(jq -r '.description // empty' "$response" 2>/dev/null || true)"
          fi
          echo "::warning::Telegram notification failed: ${description:-no API description}"
          exit 0

      - name: Free disk space
        run: |
          set -euo pipefail
          # Without debug info the source tree, objects, packages and compiler
          # cache stay well under 10 GiB. Deleting the preinstalled SDKs takes
          # minutes, so only do it when the runner is actually short on space.
          available_kb="$(df -Pk /tmp | awk 'NR == 2 { print $4 }')"
          if [[ "$available_kb" =~ ^[0-9]+$ ]] \
            && ((available_kb >= 20 * 1024 * 1024)); then
            echo "$((available_kb / 1024 / 1024)) GiB free; skipping cleanup."
          else
            set -x
            sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
              /usr/local/share/boost || true
            if [[ "${AGENT_TOOLSDIRECTORY:-}" == "/opt/hostedtoolcache" ]]; then
              sudo rm -rf /opt/hostedtoolcache
            fi
          fi
          df -h /tmp

      - name: Install build dependencies
        run: |
          set -euo pipefail
          # Skip man-db's index rebuild, which otherwise runs on every install.
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential bc kmod cpio flex libssl-dev libelf-dev libdw-dev bison \
            debhelper dpkg-dev rsync xz-utils zstd ccache

      - name: Prepare compiler cache
        id: ccache
        env:
          KERNEL_VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          series="$(cut -d. -f1,2 <<< "$KERNEL_VERSION")"
          [[ "$series" =~ ^[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::Invalid kernel version"; exit 1; }
          # The ccache masquerade directory turns every gcc/cc call, including
          # the ones made by bindeb-pkg's nested make, into a cached call.
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"
          {
            echo "CCACHE_DIR=$RUNNER_TEMP/ccache"
            echo "CCACHE_MAXSIZE=2G"
          } >> "$GITHUB_ENV"
          {
            echo "key=ccache-v1-${KERNEL_VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "series_prefix=ccache-v1-${series}."
          } >> "$GITHUB_OUTPUT"

      - name: Restore compiler cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ steps.ccache.outputs.key }}
          restore-keys: |
            ${{ steps.ccache.outputs.series_prefix }}
            ccache-v1-

      - name: Download current kernel config snapshot
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: kernel-configs-${{ github.run_id }}
          path: ${{ github.workspace }}

      - name: Clone stable kernel and verify its signed tag
        env:
          SOURCE_TAG: ${{ needs.check.outputs.source_tag }}
          SOURCE_COMMIT: ${{ needs.check.outputs.source_commit }}
        run: |
          set -euo pipefail
          if ! [[ "$SOURCE_TAG" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ \
            && "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid kernel source metadata"
            exit 1
          fi
          git clone \
            --depth=1 \
            --single-branch \
            --branch "$SOURCE_TAG" \
            "$KERNEL_REPO" \
            /tmp/linux
          actual_commit="$(git -C /tmp/linux rev-parse HEAD)"
          if [[ "$actual_commit" != "$SOURCE_COMMIT" ]]; then
            echo "::error::Source tag moved: expected $SOURCE_COMMIT, got $actual_commit"
            exit 1
          fi

          # The git server is trusted for transport only. The annotated tag
          # must carry a good signature from one of the pinned kernel.org
          # release keys, and must itself name this version and commit so an
          # older signed tag cannot be replayed under a newer ref name. Key
          # material may come from any source: only the fingerprint is trusted.
          export GNUPGHOME="$RUNNER_TEMP/kernel-gnupg"
          install -d -m 0700 "$GNUPGHOME"
          for fpr in $KERNEL_TAG_SIGNERS; do
            key_id="${fpr: -16}"
            for key_url in \
              "https://git.kernel.org/pub/scm/docs/kernel/pgpkeys.git/plain/keys/${key_id}.asc" \
              "https://keyserver.ubuntu.com/pks/lookup?op=get&options=mr&search=0x${fpr}"; do
              if curl --fail --silent --show-error --location \
                --proto '=https' --retry 2 --connect-timeout 10 --max-time 60 \
                "$key_url" \
                | gpg --batch --quiet --import-options import-minimal --import \
                  >/dev/null 2>&1 \
                && gpg --batch --list-keys "$fpr" >/dev/null 2>&1; then
                break
              fi
            done
            gpg --batch --list-keys "$fpr" >/dev/null 2>&1 \
              || echo "::warning::Could not fetch kernel signing key $fpr"
          done

          if ! tag_header="$(
            git -C /tmp/linux cat-file tag "$SOURCE_TAG" | sed -n '1,/^$/p'
          )"; then
            echo "::error::$SOURCE_TAG is not an annotated tag"
            exit 1
          fi
          if [[ "$(sed -n 's/^tag //p' <<< "$tag_header")" != "$SOURCE_TAG" \
            || "$(sed -n 's/^object //p' <<< "$tag_header")" != "$SOURCE_COMMIT" \
            || "$(sed -n 's/^type //p' <<< "$tag_header")" != "commit" ]]; then
            echo "::error::Tag object does not describe $SOURCE_TAG at $SOURCE_COMMIT"
            exit 1
          fi
          if ! tag_status="$(git -C /tmp/linux verify-tag --raw "$SOURCE_TAG" 2>&1)"; then
            printf '%s\n' "$tag_status"
            echo "::error::$SOURCE_TAG does not carry a valid kernel.org signature"
            exit 1
          fi
          tag_signer="$(
            awk '$1 == "[GNUPG:]" && $2 == "VALIDSIG" { print $NF; exit }' \
              <<< "$tag_status"
          )"
          if ! grep -q '^\[GNUPG:\] GOODSIG ' <<< "$tag_status" \
            || [[ ! "$tag_signer" =~ ^[0-9A-F]{40}$ \
              || " $KERNEL_TAG_SIGNERS " != *" $tag_signer "* ]]; then
            printf '%s\n' "$tag_status"
            echo "::error::$SOURCE_TAG is not signed by a pinned kernel.org release key"
            exit 1
          fi
          echo "$SOURCE_TAG is signed by $tag_signer"
          echo "- Stable tag signer: \`$tag_signer\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Add BBRv3 alongside BBRv1
        id: bbr3
        env:
          bbr3_branch: ${{ needs.check.outputs.bbr3_branch }}
          expected_base: ${{ needs.check.outputs.bbr3_base }}
          expected_commit_count: ${{ needs.check.outputs.bbr3_commit_count }}
          expected_tip: ${{ needs.check.outputs.bbr3_tip }}
        run: |
          set -euo pipefail
          cd /tmp/linux

          # The pristine stable tree, before any cherry-pick, is the baseline
          # the applied series is diffed against below.
          pristine_commit="$(git rev-parse HEAD)"

          if ! [[ "$bbr3_branch" =~ ^[0-9]+\.[0-9]+/bbr3$ ]]; then
            echo "::error::Invalid pinned BBRv3 branch"
            exit 1
          fi
          if ! [[ "$expected_base" =~ ^[0-9a-f]{40}$ &&
                  "$expected_tip" =~ ^[0-9a-f]{40}$ &&
                  "$expected_commit_count" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid pinned BBRv3 source metadata"
            exit 1
          fi
          if ((expected_commit_count == 0 || expected_commit_count > 64)); then
            echo "::error::Unexpected pinned BBRv3 topic series size"
            exit 1
          fi

          # The check job has already pinned and validated the linear topic
          # chain. Fetch that short chain plus its base with all referenced
          # objects -- deliberately NOT --filter. A partial fetch would make
          # this a promisor remote, and cherry-pick would then lazily ask
          # upload-pack for individual blobs by SHA. CachyOS force-pushes these
          # topic branches, so those objects can already be unreachable and the
          # lazy fetch dies with "upload-pack: not our ref".
          git remote add cachyos "$BBR3_REPO"
          fetched=false
          for attempt in 1 2 3; do
            if git fetch \
              --no-tags \
              --depth="$((expected_commit_count + 1))" \
              cachyos \
              "$bbr3_branch"; then
              fetched=true
              break
            fi
            echo "::warning::BBRv3 fetch attempt ${attempt} failed; retrying"
            sleep "$((attempt * 5))"
          done
          if [[ "$fetched" != true ]]; then
            echo "::error::Could not fetch the BBRv3 topic branch $bbr3_branch"
            exit 1
          fi

          bbr3_tip="$(git rev-parse FETCH_HEAD)"
          if [[ "$bbr3_tip" != "$expected_tip" ]]; then
            echo "::error::BBRv3 branch moved during this run: expected $expected_tip, got $bbr3_tip. Re-run the workflow to re-pin the topic branch."
            exit 1
          fi

          topic_base="$(git rev-parse "${bbr3_tip}~${expected_commit_count}")"
          if [[ "$topic_base" != "$expected_base" ]]; then
            echo "::error::BBRv3 topic base does not match the pinned comparison"
            exit 1
          fi
          merge_commits="$(git rev-list --merges "$topic_base..$bbr3_tip")"
          if [[ -n "$merge_commits" ]]; then
            echo "::error::BBRv3 topic branch contains merge commits"
            exit 1
          fi

          commits_file="$RUNNER_TEMP/bbr3-commits"
          if ! git rev-list --reverse "$topic_base..$bbr3_tip" \
            > "$commits_file"; then
            echo "::error::Could not enumerate the BBRv3 topic series"
            exit 1
          fi
          mapfile -t bbr3_commits < "$commits_file"
          if ((${#bbr3_commits[@]} == 0)); then
            echo "::error::No BBRv3 commits found on $bbr3_branch"
            exit 1
          fi
          if ((${#bbr3_commits[@]} != expected_commit_count)); then
            echo "::error::BBRv3 topic commit count does not match the pinned comparison"
            exit 1
          fi

          allowed_bbr3_file() {
            case "$1" in
              include/linux/tcp.h | \
              include/net/inet_connection_sock.h | \
              include/net/tcp.h | \
              include/net/tcp_ecn.h | \
              include/uapi/linux/inet_diag.h | \
              include/uapi/linux/rtnetlink.h | \
              include/uapi/linux/tcp.h | \
              net/ipv4/Kconfig | \
              net/ipv4/Makefile | \
              net/ipv4/bpf_tcp_ca.c | \
              net/ipv4/tcp.c | \
              net/ipv4/tcp_bbr.c | \
              net/ipv4/tcp_bbr3.c | \
              net/ipv4/tcp_cong.c | \
              net/ipv4/tcp_input.c | \
              net/ipv4/tcp_minisocks.c | \
              net/ipv4/tcp_output.c | \
              net/ipv4/tcp_timer.c | \
              tools/testing/selftests/bpf/progs/tcp_ca_kfunc.c)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          for commit in "${bbr3_commits[@]}"; do
            changed_files_file="$RUNNER_TEMP/bbr3-changed-files-${commit}"
            if ! git diff-tree \
              --no-commit-id \
              --name-only \
              -r \
              "$commit" \
              > "$changed_files_file"; then
              echo "::error::Could not inspect BBRv3 commit $commit"
              exit 1
            fi
            while IFS= read -r changed_file; do
              if ! allowed_bbr3_file "$changed_file"; then
                echo "::error::Unexpected file in BBRv3 commit $commit: $changed_file"
                exit 1
              fi
            done < "$changed_files_file"
          done

          git config user.name "Kernel Builder"
          git config user.email "kernel-builder@users.noreply.github.com"
          for commit in "${bbr3_commits[@]}"; do
            git cherry-pick "$commit"
          done

          # net/ipv4/Makefile is a GNU make file that kbuild parses on every
          # build, and $(shell ...) inside it runs at parse time. The file has
          # to stay in the allowlist for the obj-* line the series needs, so
          # constrain its shape instead: additions only, and only plain obj-*.
          makefile_diff="$RUNNER_TEMP/bbr3-makefile.diff"
          git diff "$pristine_commit" -- net/ipv4/Makefile > "$makefile_diff"
          if grep -qE '^-[^-]' "$makefile_diff"; then
            echo "::error::The BBRv3 series removes lines from net/ipv4/Makefile"
            exit 1
          fi
          while IFS= read -r added_line; do
            if ! [[ "$added_line" =~ ^\+obj-\$\(CONFIG_[A-Z0-9_]+\)[[:space:]]*\+=[[:space:]]*[A-Za-z0-9_-]+\.o$ ]]; then
              echo "::error::Unexpected net/ipv4/Makefile addition: ${added_line#+}"
              exit 1
            fi
          done < <(grep -E '^\+[^+]' "$makefile_diff" || true)

          # Kconfig is parsed by "make olddefconfig", and Kconfig macros such
          # as $(shell,...) run commands at parse time. The series may only add
          # plain symbol definitions to net/ipv4/Kconfig.
          kconfig_diff="$RUNNER_TEMP/bbr3-kconfig.diff"
          git diff "$pristine_commit" -- net/ipv4/Kconfig > "$kconfig_diff"
          if grep -qE '^\+([^+].*)?\$\(|^\+[[:space:]]*o?r?source[[:space:]]' \
            "$kconfig_diff"; then
            echo "::error::The BBRv3 series adds Kconfig macros or source directives to net/ipv4/Kconfig"
            exit 1
          fi

          grep -q '^config TCP_CONG_BBR3$' net/ipv4/Kconfig
          grep -Fq 'obj-$(CONFIG_TCP_CONG_BBR3) += tcp_bbr3.o' net/ipv4/Makefile
          grep -qE '^#define BBR_VERSION[[:space:]]+3$' net/ipv4/tcp_bbr3.c
          grep -qE '\.name[[:space:]]*=[[:space:]]*"bbr",' net/ipv4/tcp_bbr.c
          grep -qE '\.name[[:space:]]*=[[:space:]]*"bbr3",' net/ipv4/tcp_bbr3.c

          {
            echo "branch=$bbr3_branch"
            echo "tip=$bbr3_tip"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### BBR congestion control"
            echo
            echo "- BBRv1 registration: \`bbr\`"
            echo "- BBRv3 registration: \`bbr3\`"
            echo "- BBRv3 source: \`$bbr3_branch @ ${bbr3_tip:0:12}\`"
            echo "- Applied commits: \`${#bbr3_commits[@]}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure kernel
        run: |
          set -euxo pipefail
          cd /tmp/linux

          # Reproduce Debian's four cloud-amd64 layers. The project overlay is
          # deliberately last so required VPS and container features win over
          # Debian's hardware trimming.
          for fragment in \
            config.debian \
            config.amd64 \
            config.cloud \
            config.cloud-amd64 \
            config.vps; do
            if [[ ! -s "$GITHUB_WORKSPACE/$fragment" ]]; then
              echo "::error::Missing kernel config fragment: $fragment"
              exit 1
            fi
          done

          cp "$GITHUB_WORKSPACE/config.debian" .config
          scripts/kconfig/merge_config.sh -m .config \
            "$GITHUB_WORKSPACE/config.amd64" \
            "$GITHUB_WORKSPACE/config.cloud" \
            "$GITHUB_WORKSPACE/config.cloud-amd64" \
            "$GITHUB_WORKSPACE/config.vps"

          KCONFIG_WARN_UNKNOWN_SYMBOLS=1 \
          KCONFIG_WARN_CHANGED_INPUT=1 \
            make olddefconfig

          echo "=== Verifying kernel config ==="
          fail=0
          check_builtin() {
            if ! grep -qxF "CONFIG_$1=y" .config; then
              echo "::error::CONFIG_$1 must be built in"
              fail=1
            fi
          }
          check_module() {
            if ! grep -qxF "CONFIG_$1=m" .config; then
              echo "::error::CONFIG_$1 must be a module"
              fail=1
            fi
          }
          check_enabled() {
            if ! grep -qE "^CONFIG_$1=(y|m)$" .config; then
              echo "::error::CONFIG_$1 must be enabled"
              fail=1
            fi
          }
          kconfig_symbol_exists() {
            git grep -qE \
              "^[[:space:]]*(menu)?config[[:space:]]+$1([[:space:]]|$)" \
              -- '*Kconfig*'
          }
          check_disabled() {
            if ! grep -qxF "# CONFIG_$1 is not set" .config; then
              echo "::error::CONFIG_$1 must be disabled"
              fail=1
            fi
          }
          check_not_enabled() {
            # Hidden or dependency-gated symbols may be omitted from .config.
            if ! kconfig_symbol_exists "$1"; then
              echo "::error::Unknown Kconfig symbol: CONFIG_$1"
              fail=1
            elif grep -qE "^CONFIG_$1=(y|m)$" .config; then
              echo "::error::CONFIG_$1 must not be enabled"
              fail=1
            fi
          }
          check_value() {
            if ! grep -qxF "CONFIG_$1=$2" .config; then
              echo "::error::CONFIG_$1 must equal $2"
              fail=1
            fi
          }
          check_empty_string() {
            # Path-valued options would embed files from the build machine
            # into the published kernel image.
            if grep -qE "^CONFIG_$1=\"[^\"]" .config; then
              echo "::error::CONFIG_$1 must be empty"
              fail=1
            fi
          }

          while IFS= read -r requested_setting; do
            if [[ ! "$requested_setting" =~ ^CONFIG_[A-Z0-9_]+= \
              && ! "$requested_setting" =~ ^#\ CONFIG_[A-Z0-9_]+\ is\ not\ set$ ]]; then
              continue
            fi
            if [[ "$requested_setting" =~ ^#\ CONFIG_([A-Z0-9_]+)\ is\ not\ set$ ]]; then
              requested_symbol="${BASH_REMATCH[1]}"
              if grep -qxF "$requested_setting" .config; then
                continue
              elif ! kconfig_symbol_exists "$requested_symbol"; then
                echo "::error::Unknown overlay symbol: CONFIG_$requested_symbol"
                fail=1
              elif grep -q "^CONFIG_${requested_symbol}=" .config; then
                echo "::error::Overlay request was not honored: $requested_setting"
                fail=1
              fi
            elif ! grep -qxF "$requested_setting" .config; then
              echo "::error::Overlay request was not honored: $requested_setting"
              fail=1
            fi
          done < "$GITHUB_WORKSPACE/config.vps"

          required_builtin=(
            X86_64 SMP PREEMPT_LAZY PCI PCI_MSI ACPI BLK_DEV_INITRD
            DEVTMPFS DEVTMPFS_MOUNT PROC_FS SYSFS TMPFS EFI EFI_STUB
            SERIAL_8250 SERIAL_8250_CONSOLE
            MODULES MODULE_UNLOAD MODULE_COMPRESS_ZSTD MODULE_DECOMPRESS
            MODULE_SIG SCSI
            PACKET UNIX INET IPV6 NET_SCHED NET_SCH_FQ DEFAULT_FQ
            TCP_CONG_CUBIC TCP_CONG_BBR DEFAULT_BBR
            HYPERVISOR_GUEST PARAVIRT VIRTIO VIRTIO_PCI EXT4_FS
            NAMESPACES NET_NS PID_NS IPC_NS UTS_NS USER_NS
            CGROUPS CGROUP_CPUACCT CGROUP_DEVICE CGROUP_FREEZER
            CGROUP_SCHED CGROUP_PIDS CGROUP_BPF CPUSETS MEMCG
            BLK_CGROUP BLK_DEV_THROTTLING FAIR_GROUP_SCHED CFS_BANDWIDTH
            KEYS SECCOMP SECCOMP_FILTER POSIX_MQUEUE BPF BPF_SYSCALL
            NETFILTER
          )
          required_modules=(
            TCP_CONG_BBR3 VIRTIO_BLK SCSI_VIRTIO VIRTIO_NET
            VIRTIO_CONSOLE VIRTIO_BALLOON HW_RANDOM_VIRTIO
            XEN_BLKDEV_FRONTEND XEN_NETDEV_FRONTEND
            HYPERV_STORAGE HYPERV_NET VMWARE_PVSCSI VMXNET3
            E1000 E1000E ENA_ETHERNET GVE MICROSOFT_MANA I40EVF
          )
          required_enabled=(
            BLK_DEV_SD SATA_AHCI ATA_PIIX BLK_DEV_NVME
            XEN HYPERV OVERLAY_FS XFS_FS BTRFS_FS FUSE_FS
            TUN VETH BRIDGE BRIDGE_NETFILTER VXLAN IPVLAN MACVLAN
            NF_CONNTRACK NF_NAT NF_TABLES NFT_CT NFT_NAT NFT_MASQ
            NETFILTER_XT_MARK NETFILTER_XT_MATCH_ADDRTYPE
            NETFILTER_XT_MATCH_CONNTRACK NETFILTER_XT_MATCH_IPVS
            IP_NF_FILTER IP_NF_RAW IP_NF_MANGLE IP_NF_NAT
            IP_NF_TARGET_MASQUERADE IP6_NF_FILTER IP6_NF_RAW
            IP6_NF_MANGLE IP6_NF_NAT IP6_NF_TARGET_MASQUERADE
            IP_VS WIREGUARD
            SWAP PSI CGROUP_HUGETLB CGROUP_MISC
            SECURITY SECURITY_APPARMOR AUDIT
            NF_TABLES_INET NF_CONNTRACK_BRIDGE
            NETFILTER_XT_MATCH_COMMENT NETFILTER_XT_MATCH_MULTIPORT
            NETFILTER_XT_TARGET_REDIRECT
            IP_NF_TARGET_REJECT IP6_NF_TARGET_REJECT
            VLAN_8021Q OPENVSWITCH MPLS
          )

          for symbol in "${required_builtin[@]}"; do
            check_builtin "$symbol"
          done
          for symbol in "${required_modules[@]}"; do
            check_module "$symbol"
          done
          for symbol in "${required_enabled[@]}"; do
            check_enabled "$symbol"
          done

          check_value LOCALVERSION '""'
          check_value NR_CPUS 256
          check_value HZ 250
          check_value DEFAULT_TCP_CONG '"bbr"'
          check_value DEFAULT_NET_SCH '"fq"'
          check_disabled LOCALVERSION_AUTO
          check_disabled MODULE_SIG_ALL
          check_disabled MODULE_SIG_FORCE
          check_disabled WERROR
          check_builtin DEBUG_INFO_NONE
          check_not_enabled DEBUG_INFO
          check_not_enabled GDB_SCRIPTS
          check_not_enabled LOCKDEP
          check_not_enabled DEFAULT_BBR3
          check_empty_string INITRAMFS_SOURCE
          check_empty_string EXTRA_FIRMWARE
          [[ "$LOCALVERSION" == "-shouyu" ]] || {
            echo "::error::LOCALVERSION is invalid"
            fail=1
          }

          if [[ "$fail" -ne 0 ]]; then
            echo "::error::Kernel config verification failed"
            exit 1
          fi
          echo "All checks passed."

      - name: Build kernel
        id: build-kernel
        env:
          EXPECTED_RELEASE: ${{ needs.check.outputs.version }}-shouyu
        run: |
          set -euxo pipefail
          cd /tmp/linux
          KREL="$(make -s kernelrelease)"
          if [[ "$KREL" != "$EXPECTED_RELEASE" ]]; then
            echo "::error::Expected kernel release $EXPECTED_RELEASE, got $KREL"
            exit 1
          fi
          ccache --zero-stats
          # bindeb-pkg is rootless (Rules-Requires-Root: no; dpkg-deb
          # --root-owner-group), so the compile does not run under fakeroot's
          # LD_PRELOAD, which serializes every stat() through faked.
          make -j"$(nproc)" bindeb-pkg \
            KBUILD_DEBARCH=amd64 \
            KDEB_PKGVERSION="${KREL}-1"
          {
            echo "### Compiler cache"
            echo
            echo '```'
            ccache --show-stats
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save compiler cache
        if: >-
          ${{
            always() &&
            (steps.build-kernel.outcome == 'success' ||
             steps.build-kernel.outcome == 'failure')
          }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ steps.ccache.outputs.key }}

      - name: Get kernel release
        id: krel
        env:
          EXPECTED_RELEASE: ${{ needs.check.outputs.version }}-shouyu
        run: |
          set -euo pipefail
          cd /tmp/linux
          release="$(make -s kernelrelease)"
          expected="$EXPECTED_RELEASE"
          if [[ "$release" != "$expected" ]]; then
            echo "::error::Expected kernel release $expected, got $release"
            exit 1
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Collect and verify Debian packages
        id: packages
        env:
          krel: ${{ steps.krel.outputs.release }}
        run: |
          set -euxo pipefail
          shopt -s nullglob
          image_packages=(/tmp/"linux-image-${krel}_"*"_amd64.deb")
          header_packages=(/tmp/"linux-headers-${krel}_"*"_amd64.deb")

          if ((${#image_packages[@]} != 1)); then
            echo "::error::Expected exactly one linux-image package, found ${#image_packages[@]}"
            printf '  %s\n' "${image_packages[@]:-}"
            exit 1
          fi
          if ((${#header_packages[@]} != 1)); then
            echo "::error::Expected exactly one linux-headers package, found ${#header_packages[@]}"
            printf '  %s\n' "${header_packages[@]:-}"
            exit 1
          fi

          verify_deb() {
            local deb="$1"
            local expected_package="$2"
            local package
            local architecture
            local version
            package="$(dpkg-deb -f "$deb" Package)"
            architecture="$(dpkg-deb -f "$deb" Architecture)"
            version="$(dpkg-deb -f "$deb" Version)"
            if [[ "$package" != "$expected_package" \
              || "$architecture" != "amd64" \
              || "$version" != "${krel}-1" ]]; then
              echo "::error::Unexpected package metadata: $package $version ($architecture)"
              exit 1
            fi
          }

          verify_deb "${image_packages[0]}" "linux-image-$krel"
          verify_deb "${header_packages[0]}" "linux-headers-$krel"

          mkdir -p artifacts
          cp -v "${image_packages[0]}" "${header_packages[0]}" artifacts/
          ls -lh artifacts/

          {
            echo "image=$(basename "${image_packages[0]}")"
            echo "headers=$(basename "${header_packages[0]}")"
          } >> "$GITHUB_OUTPUT"

      - name: Verify image package contents
        env:
          krel: ${{ steps.krel.outputs.release }}
          IMAGE_PACKAGE: ${{ steps.packages.outputs.image }}
        run: |
          set -euxo pipefail
          image_deb="artifacts/$IMAGE_PACKAGE"

          # The packages are built without fakeroot, so prove that every
          # installed path is still owned by root rather than the runner user.
          for deb in artifacts/*.deb; do
            if ! dpkg-deb --fsys-tarfile "$deb" \
              | tar -tvf - \
              | awk '$2 != "root/root" { print; bad = 1 } END { exit bad }'; then
              echo "::error::$deb contains files not owned by root:root"
              exit 1
            fi
          done

          mkdir -p /tmp/img-check
          dpkg-deb -x "$image_deb" /tmp/img-check

          cfg="/tmp/img-check/boot/config-$krel"
          module_root="/tmp/img-check/lib/modules/$krel"
          if [[ ! -s "$cfg" || ! -d "$module_root" ]]; then
            echo "::error::Kernel config missing from image package"
            exit 1
          fi

          verify_feature() {
            local display_name="$1"
            local config_symbol="$2"
            local module_name="$3"

            if grep -q "^CONFIG_${config_symbol}=y$" "$cfg"; then
              echo "$display_name is built in"
              return
            fi

            if grep -q "^CONFIG_${config_symbol}=m$" "$cfg" \
              && find "$module_root" -type f \
                \( -name "${module_name}.ko" -o -name "${module_name}.ko.*" \) \
                -print -quit | grep -q .; then
              echo "$display_name module found"
              return
            fi

            echo "::error::$display_name is missing from the image package"
            exit 1
          }

          verify_feature BBRv1 TCP_CONG_BBR tcp_bbr
          verify_feature BBRv3 TCP_CONG_BBR3 tcp_bbr3
          verify_feature "VirtIO block" VIRTIO_BLK virtio_blk
          verify_feature "VirtIO SCSI" SCSI_VIRTIO virtio_scsi
          verify_feature "VirtIO network" VIRTIO_NET virtio_net
          verify_feature "Xen block" XEN_BLKDEV_FRONTEND xen-blkfront
          verify_feature "Xen network" XEN_NETDEV_FRONTEND xen-netfront
          verify_feature "Hyper-V storage" HYPERV_STORAGE hv_storvsc
          verify_feature "Hyper-V network" HYPERV_NET hv_netvsc
          verify_feature "VMware storage" VMWARE_PVSCSI vmw_pvscsi
          verify_feature "VMware network" VMXNET3 vmxnet3
          verify_feature "AWS ENA" ENA_ETHERNET ena
          verify_feature "Google gVNIC" GVE gve
          verify_feature "Azure MANA" MICROSOFT_MANA mana
          verify_feature "Intel iAVF" I40EVF iavf

          grep -q '^CONFIG_DEFAULT_TCP_CONG="bbr"$' "$cfg" || \
            { echo "::error::BBRv1 is not the default"; exit 1; }
          grep -q '^CONFIG_DEFAULT_NET_SCH="fq"$' "$cfg" || \
            { echo "::error::FQ is not the default qdisc"; exit 1; }

      - name: Record build time
        id: metadata
        run: |
          set -euo pipefail
          echo "build_time=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kernel-packages-${{ github.run_id }}
          path: artifacts/*.deb
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 1

  release:
    name: Release ${{ needs.build.outputs.kernel_release }}
    needs:
      - check
      - build
    if: needs.check.outputs.should_build == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download verified kernel packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: kernel-packages-${{ github.run_id }}
          path: artifacts

      - name: Create or repair Release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_TIME: ${{ needs.build.outputs.build_time }}
          KERNEL_RELEASE: ${{ needs.build.outputs.kernel_release }}
          RELEASE_TAG: ${{ needs.check.outputs.release_tag }}
          RELEASE_TARGET: ${{ needs.check.outputs.release_target }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          if ! [[ "$RELEASE_TAG" == "v${KERNEL_RELEASE}" \
            && "$KERNEL_RELEASE" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?-shouyu$ \
            && "$RELEASE_TARGET" =~ ^[0-9a-f]{40}$ \
            && "$BUILD_TIME" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]; then
            echo "::error::Unsafe Release metadata"
            exit 1
          fi

          packages=(artifacts/*.deb)
          if ((${#packages[@]} != 2)); then
            echo "::error::Expected exactly two verified packages"
            exit 1
          fi

          declare -A local_path=()
          declare -A local_name=()
          declare -A local_digest=()
          declare -A local_size=()
          for package_path in "${packages[@]}"; do
            filename="$(basename "$package_path")"
            case "$filename" in
              "linux-image-${KERNEL_RELEASE}_${KERNEL_RELEASE}-1_amd64.deb")
                kind=image
                ;;
              "linux-headers-${KERNEL_RELEASE}_${KERNEL_RELEASE}-1_amd64.deb")
                kind=headers
                ;;
              *)
                echo "::error::Unexpected Release package: $filename"
                exit 1
                ;;
            esac
            if [[ ${local_path["$kind"]+present} ]]; then
              echo "::error::Duplicate $kind package"
              exit 1
            fi
            local_path["$kind"]="$package_path"
            local_name["$kind"]="$filename"
            local_digest["$kind"]="sha256:$(sha256sum "$package_path" | awk '{ print $1 }')"
            local_size["$kind"]="$(stat -c '%s' "$package_path")"
          done
          for kind in image headers; do
            [[ ${local_path["$kind"]+present} ]] \
              || { echo "::error::Missing $kind package"; exit 1; }
          done

          notes_file="$RUNNER_TEMP/release.md"
          printf 'Version: `%s`\n\nBuild time: `%s`\n' \
            "$KERNEL_RELEASE" \
            "$BUILD_TIME" \
            > "$notes_file"

          release_json="$RUNNER_TEMP/release-before.json"
          release_error="$RUNNER_TEMP/release-before.err"
          release_exists=false
          if gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            > "$release_json" 2> "$release_error"; then
            release_exists=true
          elif grep -q 'HTTP 404' "$release_error"; then
            release_exists=false
          else
            cat "$release_error" >&2
            echo "::error::Could not determine whether the Release exists"
            exit 1
          fi

          if [[ "$release_exists" == true ]]; then
            release_id="$(jq -er '.id' "$release_json")"
            remote_assets_file="$RUNNER_TEMP/release-assets-before.tsv"
            if ! gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
              --jq '
                .[]
                | [
                    (.id | tostring),
                    .name,
                    .state,
                    (.digest // ""),
                    (.size | tostring)
                  ]
                | @tsv
              ' > "$remote_assets_file"; then
              echo "::error::Could not query existing Release assets"
              exit 1
            fi

            declare -A remote_id=()
            declare -A remote_state=()
            declare -A remote_digest=()
            declare -A remote_size=()
            declare -a remote_names=()
            while IFS=$'\t' read -r id name state digest size; do
              if [[ ${remote_id["$name"]+present} ]]; then
                echo "::error::Duplicate asset name in existing Release: $name"
                exit 1
              fi
              remote_names+=("$name")
              remote_id["$name"]="$id"
              remote_state["$name"]="$state"
              remote_digest["$name"]="$digest"
              remote_size["$name"]="$size"
            done < "$remote_assets_file"

            # Fill missing packages first so a repair never starts by emptying
            # an existing public Release.
            for kind in image headers; do
              name="${local_name[$kind]}"
              if [[ ! ${remote_id["$name"]+present} ]]; then
                gh release upload \
                  "$RELEASE_TAG" \
                  "${local_path[$kind]}" \
                  --repo "$GITHUB_REPOSITORY"
              fi
            done

            # Replace only conflicting expected packages, one at a time.
            for kind in image headers; do
              name="${local_name[$kind]}"
              [[ ${remote_id["$name"]+present} ]] || continue
              if [[ "${remote_state[$name]}" != "uploaded" \
                || "${remote_digest[$name]}" != "${local_digest[$kind]}" \
                || "${remote_size[$name]}" != "${local_size[$kind]}" ]]; then
                gh api \
                  --method DELETE \
                  "repos/${GITHUB_REPOSITORY}/releases/assets/${remote_id[$name]}"
                gh release upload \
                  "$RELEASE_TAG" \
                  "${local_path[$kind]}" \
                  --repo "$GITHUB_REPOSITORY"
              fi
            done

            # Remove obsolete README or old package assets only after both
            # expected packages have been uploaded or retained.
            for name in "${remote_names[@]}"; do
              if [[ "$name" != "${local_name[image]}" \
                && "$name" != "${local_name[headers]}" ]]; then
                gh api \
                  --method DELETE \
                  "repos/${GITHUB_REPOSITORY}/releases/assets/${remote_id[$name]}"
              fi
            done

            gh release edit \
              "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$KERNEL_RELEASE" \
              --notes-file "$notes_file" \
              --draft=false \
              --prerelease=false \
              --latest
          else
            gh release create \
              "$RELEASE_TAG" \
              "${packages[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$KERNEL_RELEASE" \
              --notes-file "$notes_file" \
              --target "$RELEASE_TARGET" \
              --latest
          fi

          expected_body="$(cat "$notes_file")"
          final_release_json="$RUNNER_TEMP/release-after.json"
          final_assets_file="$RUNNER_TEMP/release-assets-after.tsv"
          verified=false
          for attempt in 1 2 3 4 5; do
            if ! gh api \
              "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
              > "$final_release_json"; then
              echo "::error::Could not verify the Release"
              exit 1
            fi
            final_release_id="$(jq -er '.id' "$final_release_json")"
            if ! gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/releases/${final_release_id}/assets?per_page=100" \
              --jq '
                .[]
                | [
                    .name,
                    .state,
                    (.digest // ""),
                    (.size | tostring)
                  ]
                | @tsv
              ' > "$final_assets_file"; then
              echo "::error::Could not verify Release assets"
              exit 1
            fi

            actual_name="$(jq -r '.name // ""' "$final_release_json")"
            actual_body="$(jq -r '.body // ""' "$final_release_json")"
            release_state_valid=false
            if jq -e --arg tag "$RELEASE_TAG" '
              .tag_name == $tag
              and .draft == false
              and .prerelease == false
            ' "$final_release_json" >/dev/null; then
              release_state_valid=true
            fi
            mapfile -t final_assets < "$final_assets_file"
            assets_valid=true
            declare -A verified_kinds=()
            if ((${#final_assets[@]} != 2)); then
              assets_valid=false
            else
              for record in "${final_assets[@]}"; do
                IFS=$'\t' read -r name state digest size <<< "$record"
                kind=""
                if [[ "$name" == "${local_name[image]}" ]]; then
                  kind=image
                elif [[ "$name" == "${local_name[headers]}" ]]; then
                  kind=headers
                else
                  assets_valid=false
                  continue
                fi
                verified_kinds["$kind"]=1
                if [[ "$state" != "uploaded" \
                  || "$digest" != "${local_digest[$kind]}" \
                  || "$size" != "${local_size[$kind]}" ]]; then
                  assets_valid=false
                fi
              done
              [[ ${verified_kinds["image"]+present} \
                && ${verified_kinds["headers"]+present} ]] \
                || assets_valid=false
            fi

            if [[ "$actual_name" == "$KERNEL_RELEASE" \
              && "$actual_body" == "$expected_body" \
              && "$release_state_valid" == true \
              && "$assets_valid" == true ]]; then
              verified=true
              break
            fi
            sleep "$((attempt * 2))"
          done
          [[ "$verified" == true ]] \
            || { echo "::error::Release verification failed"; exit 1; }

  apt-repository:
    name: Publish signed APT repository
    needs:
      - check
      - build
      - release
      - repair-existing-release
    if: >-
      ${{
        always() &&
        needs.check.result == 'success' &&
        (needs.release.result == 'success' ||
         needs.repair-existing-release.result == 'success')
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      APT_PUBLIC_KEY: apt/shouyu-kernel-archive-keyring.asc
      REPOSITORY: ${{ github.repository }}
      FROM_BUILD: ${{ needs.release.result == 'success' }}
      KERNEL_RELEASE: >-
        ${{
          needs.release.result == 'success'
          && needs.build.outputs.kernel_release
          || needs.check.outputs.existing_kernel_release
        }}
      RELEASE_TAG: >-
        ${{
          needs.release.result == 'success'
          && needs.check.outputs.release_tag
          || needs.check.outputs.existing_release_tag
        }}

    steps:
      - name: Checkout repository scripts and APT key
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            apt

      - name: Inspect the published APT repository
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY != '' }}
        run: |
          set -euo pipefail
          export WORK_DIR="$RUNNER_TEMP/apt"
          mkdir -p "$WORK_DIR"
          echo "WORK_DIR=$WORK_DIR" >> "$GITHUB_ENV"

          if [[ ! -s "$APT_PUBLIC_KEY" || "$HAS_SIGNING_KEY" != true ]]; then
            echo "::notice::APT publishing is not configured yet: commit $APT_PUBLIC_KEY and add the APT_SIGNING_KEY secret (see README)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$KERNEL_RELEASE" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?(-(shouyu|cloud))?$ \
            && "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?(-(shouyu|cloud))?(-[0-9]+)?$ ]]; then
            echo "::error::Unsafe Release identity for the APT repository"
            exit 1
          fi

          # The index must describe the exact bytes that the versioned
          # Release serves to users.
          release_json="$WORK_DIR/release.json"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            > "$release_json"
          if ! jq -e '.draft == false and .prerelease == false' \
            "$release_json" >/dev/null; then
            echo "::error::$RELEASE_TAG is not a published final Release"
            exit 1
          fi
          asset_digest() {
            jq -r --arg name "$1" '
              [.assets[] | select(.name == $name and .state == "uploaded")]
              | if length == 1 then (.[0].digest // "") else "" end
            ' "$release_json"
          }
          image_name="linux-image-${KERNEL_RELEASE}_${KERNEL_RELEASE}-1_amd64.deb"
          headers_name="linux-headers-${KERNEL_RELEASE}_${KERNEL_RELEASE}-1_amd64.deb"
          image_digest="$(asset_digest "$image_name")"
          headers_digest="$(asset_digest "$headers_name")"
          if ! [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ \
            && "$headers_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::$RELEASE_TAG lacks uniquely named packages with SHA-256 digests"
            exit 1
          fi
          export EXPECTED_IMAGE_SHA256="${image_digest#sha256:}"
          export EXPECTED_HEADERS_SHA256="${headers_digest#sha256:}"
          {
            echo "EXPECTED_IMAGE_SHA256=$EXPECTED_IMAGE_SHA256"
            echo "EXPECTED_HEADERS_SHA256=$EXPECTED_HEADERS_SHA256"
            echo "IMAGE_NAME=$image_name"
            echo "HEADERS_NAME=$headers_name"
          } >> "$GITHUB_ENV"

          inspect_status=0
          bash .github/scripts/apt-repo.sh inspect || inspect_status=$?
          case "$inspect_status" in
            0) current=true ;;
            10) current=false ;;
            *) exit "$inspect_status" ;;
          esac
          {
            echo "enabled=true"
            echo "current=$current"
          } >> "$GITHUB_OUTPUT"

      - name: Download the verified build packages
        if: >-
          steps.inspect.outputs.enabled == 'true' &&
          steps.inspect.outputs.current != 'true' &&
          env.FROM_BUILD == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: kernel-packages-${{ github.run_id }}
          path: ${{ runner.temp }}/apt-packages

      - name: Download the published packages
        if: >-
          steps.inspect.outputs.enabled == 'true' &&
          steps.inspect.outputs.current != 'true' &&
          env.FROM_BUILD != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/apt-packages" \
            --pattern "$IMAGE_NAME" \
            --pattern "$HEADERS_NAME"

      - name: Build and sign the APT index
        if: >-
          steps.inspect.outputs.enabled == 'true' &&
          steps.inspect.outputs.current != 'true'
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_KEY_PASSPHRASE: ${{ secrets.APT_SIGNING_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          # The private key exists only inside this step's throwaway keyring;
          # the agent is stopped and the keyring wiped however the step ends.
          export GNUPGHOME="$RUNNER_TEMP/apt-gnupg"
          install -d -m 0700 "$GNUPGHOME"
          trap 'gpgconf --kill all >/dev/null 2>&1 || true; rm -rf "$GNUPGHOME"' EXIT

          mapfile -t key_fprs < <(
            gpg --batch --with-colons --import-options show-only \
              --import "$APT_PUBLIC_KEY" 2>/dev/null \
              | awk -F: '$1 == "pub" { want = 1; next }
                  want && $1 == "fpr" { print $10; want = 0 }'
          )
          if ((${#key_fprs[@]} != 1)) || [[ ! "${key_fprs[0]}" =~ ^[0-9A-F]{40}$ ]]; then
            echo "::error::$APT_PUBLIC_KEY must contain exactly one public key"
            exit 1
          fi
          signing_fpr="${key_fprs[0]}"

          import=(gpg --batch --quiet --pinentry-mode loopback)
          if [[ -n "${APT_SIGNING_KEY_PASSPHRASE:-}" ]]; then
            passphrase_file="$GNUPGHOME/passphrase"
            (umask 077 && printf '%s' "$APT_SIGNING_KEY_PASSPHRASE" > "$passphrase_file")
            import+=(--passphrase-file "$passphrase_file")
            export APT_SIGNING_PASSPHRASE_FILE="$passphrase_file"
          fi
          printf '%s\n' "$APT_SIGNING_KEY" | "${import[@]}" --import
          secret_keys="$(
            gpg --batch --with-colons --list-secret-keys "$signing_fpr" \
              2>/dev/null || true
          )"
          if ! grep -q '^sec:' <<< "$secret_keys"; then
            echo "::error::APT_SIGNING_KEY does not match $APT_PUBLIC_KEY ($signing_fpr)"
            exit 1
          fi

          APT_SIGNING_FPR="$signing_fpr" \
          PACKAGE_DIR="$RUNNER_TEMP/apt-packages" \
          OUT_DIR="$RUNNER_TEMP/apt-out" \
            bash .github/scripts/apt-repo.sh build

      - name: Publish the APT index
        if: >-
          steps.inspect.outputs.enabled == 'true' &&
          steps.inspect.outputs.current != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/apt-out"
          apt_release_json="$WORK_DIR/apt-release.json"
          apt_release_error="$WORK_DIR/apt-release.err"

          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${APT_SUITE}" \
            > "$apt_release_json" 2> "$apt_release_error"; then
            # A prerelease can never become "latest", so the legacy installer
            # and the kernel Release logic never mistake it for a kernel.
            if ! jq -e '.draft == false and .prerelease == true' \
              "$apt_release_json" >/dev/null; then
              gh release edit "$APT_SUITE" \
                --repo "$GITHUB_REPOSITORY" \
                --draft=false \
                --prerelease
            fi
          elif grep -q 'HTTP 404' "$apt_release_error"; then
            notes_file="$WORK_DIR/apt-notes.md"
            {
              echo "Signed APT index for this project. Do not delete this Release."
              echo
              echo '```'
              echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/shouyu-kernel.asc] https://github.com/${GITHUB_REPOSITORY}/releases/download/ ${APT_SUITE}/"
              echo '```'
            } > "$notes_file"
            gh release create "$APT_SUITE" \
              --repo "$GITHUB_REPOSITORY" \
              --title "APT repository" \
              --notes-file "$notes_file" \
              --target "$(git rev-parse HEAD)" \
              --prerelease
          else
            cat "$apt_release_error" >&2
            echo "::error::Could not read the $APT_SUITE Release"
            exit 1
          fi

          apt_release_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${APT_SUITE}" --jq '.id'
          )"
          assets_file="$WORK_DIR/apt-assets.tsv"
          list_assets() {
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/releases/${apt_release_id}/assets?per_page=100" \
              --jq '.[] | [(.id | tostring), .name, .created_at, (.digest // "")] | @tsv' \
              > "$assets_file"
          }
          list_assets
          declare -A published_digest=()
          while IFS=$'\t' read -r asset_id asset_name created_at digest; do
            published_digest["$asset_name"]="$digest"
          done < "$assets_file"

          # Meta-packages are built byte-identically, so an unchanged one
          # keeps its existing asset instead of a delete-and-reupload gap.
          uploads=()
          for deb in "$out"/linux-image-shouyu_*_amd64.deb "$out"/linux-headers-shouyu_*_amd64.deb; do
            digest="sha256:$(sha256sum "$deb" | awk '{ print $1 }')"
            if [[ "${published_digest["$(basename "$deb")"]:-}" != "$digest" ]]; then
              uploads+=("$deb")
            fi
          done

          # Package files first, the signed metadata last, so a client that
          # sees the new InRelease also finds the files it describes.
          gh release upload "$APT_SUITE" --repo "$GITHUB_REPOSITORY" --clobber \
            ${uploads[@]+"${uploads[@]}"} \
            "$out/Packages" \
            "$out/Packages.gz"
          gh release upload "$APT_SUITE" --repo "$GITHUB_REPOSITORY" --clobber \
            "$out/Release" \
            "$out/Release.gpg"
          gh release upload "$APT_SUITE" --repo "$GITHUB_REPOSITORY" --clobber \
            "$out/InRelease"

          # Clients that ran "apt update" before this publish still resolve the
          # previous meta-packages, so a superseded meta-package stays until its
          # replacement has been live for 30 days. Anything else that is no
          # longer part of the index is removed right away.
          retention_seconds=$((30 * 24 * 60 * 60))
          now="$(date -u +%s)"
          current_meta=("$out"/linux-image-shouyu_*_amd64.deb)
          current_version="$(basename "${current_meta[0]}")"
          current_version="${current_version#linux-image-shouyu_}"
          current_version="${current_version%_amd64.deb}"
          declare -A keep=()
          for file in "$out"/*; do
            keep["$(basename "$file")"]=1
          done
          declare -A meta_published_at=()
          declare -A meta_asset_ids=()
          list_assets
          while IFS=$'\t' read -r asset_id asset_name created_at digest; do
            if [[ "$asset_name" =~ ^linux-(image|headers)-shouyu_([0-9][0-9A-Za-z.+~-]*)_amd64\.deb$ ]]; then
              version="${BASH_REMATCH[2]}"
              published_at="$(date -u -d "$created_at" +%s)"
              if [[ -z "${meta_published_at[$version]:-}" ]] \
                || ((published_at < ${meta_published_at[$version]})); then
                meta_published_at["$version"]="$published_at"
              fi
              [[ "$version" == "$current_version" ]] \
                || meta_asset_ids["$version"]+="$asset_id "
            elif [[ ! ${keep["$asset_name"]+present} ]]; then
              echo "Removing obsolete APT asset $asset_name"
              gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" < /dev/null
            fi
          done < "$assets_file"
          mapfile -t meta_versions < <(printf '%s\n' "${!meta_published_at[@]}" | sort -V)
          for ((index = 0; index + 1 < ${#meta_versions[@]}; index++)); do
            version="${meta_versions[index]}"
            [[ -n "${meta_asset_ids[$version]:-}" ]] || continue
            superseded_at="${meta_published_at[${meta_versions[index + 1]}]}"
            if ((now - superseded_at < retention_seconds)); then
              echo "Keeping superseded meta-packages $version for cached indexes"
              continue
            fi
            for asset_id in ${meta_asset_ids[$version]}; do
              echo "Removing expired meta-package asset $asset_id ($version)"
              gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
            done
          done

      - name: Verify the published APT repository end to end
        if: >-
          steps.inspect.outputs.enabled == 'true' &&
          steps.inspect.outputs.current != 'true'
        run: |
          set -euo pipefail
          # GitHub can take more than a minute before a newly created Release
          # or a replaced asset is served under releases/download/, so allow
          # up to eight minutes before declaring the publish broken.
          verified=false
          for delay in 0 15 30 45 60 90 120 120; do
            sleep "$delay"
            if bash .github/scripts/apt-repo.sh inspect --download-all; then
              verified=true
              break
            fi
          done
          [[ "$verified" == true ]] \
            || { echo "::error::Published APT repository failed verification"; exit 1; }
          {
            echo "### APT repository"
            echo
            echo "- Kernel: \`$KERNEL_RELEASE\` from \`$RELEASE_TAG\`"
            echo "- Source: \`deb https://github.com/${GITHUB_REPOSITORY}/releases/download/ ${APT_SUITE}/\`"
          } >> "$GITHUB_STEP_SUMMARY"

  telegram-notify:
    name: Notify Telegram of the result
    needs:
      - check
      - build
      - release
      - apt-repository
    if: ${{ always() && needs.check.outputs.should_build == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Notify successful release
        if: >-
          ${{
            needs.check.result == 'success' &&
            needs.build.result == 'success' &&
            needs.release.result == 'success' &&
            needs.apt-repository.result == 'success'
          }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
          KERNEL_RELEASE: ${{ needs.build.outputs.kernel_release }}
          BUILD_TIME: ${{ needs.build.outputs.build_time }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.check.outputs.release_tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ -z "${TELEGRAM_BOT_TOKEN:-}" || -z "${TELEGRAM_CHAT_ID:-}" ]]; then
            echo "Telegram notification skipped: TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not configured." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          request=(
            --fail-with-body
            --silent
            --connect-timeout 5
            --max-time 20
            --retry 2
            --retry-delay 1
            --retry-connrefused
            --request POST
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID"
          )
          if [[ -n "${TELEGRAM_MESSAGE_THREAD_ID:-}" ]]; then
            if ! [[ "$TELEGRAM_MESSAGE_THREAD_ID" =~ ^[1-9][0-9]*$ ]]; then
              echo "::warning::TELEGRAM_MESSAGE_THREAD_ID must be a positive integer"
              exit 0
            fi
          fi

          message="$(printf \
            '内核编译并发布成功\n版本：%s\n构建时间：%s\nRelease：%s\n运行记录：%s' \
            "$KERNEL_RELEASE" "$BUILD_TIME" "$RELEASE_URL" "$RUN_URL")"
          request+=(--data-urlencode "text=$message")
          send_request=("${request[@]}")
          if [[ -n "${TELEGRAM_MESSAGE_THREAD_ID:-}" ]]; then
            send_request+=(--data-urlencode "message_thread_id=$TELEGRAM_MESSAGE_THREAD_ID")
          fi

          response="$RUNNER_TEMP/telegram-response.json"
          telegram_url="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
          if curl "${send_request[@]}" --output "$response" "$telegram_url"; then
            exit 0
          fi

          description="$(jq -r '.description // empty' "$response" 2>/dev/null || true)"
          if [[ -n "${TELEGRAM_MESSAGE_THREAD_ID:-}" ]]; then
            echo "::warning::Telegram topic notification failed: ${description:-no API description}; retrying without message_thread_id"
            if curl "${request[@]}" --output "$response" "$telegram_url"; then
              exit 0
            fi
            description="$(jq -r '.description // empty' "$response" 2>/dev/null || true)"
          fi
          echo "::warning::Telegram notification failed: ${description:-no API description}"
          exit 0

      - name: Notify failed build or release
        if: >-
          ${{
            always() &&
            (
              needs.check.result != 'success' ||
              needs.build.result != 'success' ||
              needs.release.result != 'success' ||
              needs.apt-repository.result != 'success'
            )
          }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
          TARGET_VERSION: ${{ needs.check.outputs.version }}-shouyu
          CHECK_RESULT: ${{ needs.check.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
          APT_RESULT: ${{ needs.apt-repository.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ -z "${TELEGRAM_BOT_TOKEN:-}" || -z "${TELEGRAM_CHAT_ID:-}" ]]; then
            echo "Telegram notification skipped: TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not configured." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          request=(
            --fail-with-body
            --silent
            --connect-timeout 5
            --max-time 20
            --retry 2
            --retry-delay 1
            --retry-connrefused
            --request POST
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID"
          )
          if [[ -n "${TELEGRAM_MESSAGE_THREAD_ID:-}" ]]; then
            if ! [[ "$TELEGRAM_MESSAGE_THREAD_ID" =~ ^[1-9][0-9]*$ ]]; then
              echo "::warning::TELEGRAM_MESSAGE_THREAD_ID must be a positive integer"
              exit 0
            fi
          fi

          message="$(printf \
            '内核编译或发布失败\n目标版本：%s\n检查：%s\n编译：%s\n发布：%s\nAPT 仓库：%s\n运行记录：%s' \
            "$TARGET_VERSION" "$CHECK_RESULT" "$BUILD_RESULT" \
            "$RELEASE_RESULT" "$APT_RESULT" "$RUN_URL")"
          request+=(--data-urlencode "text=$message")
          send_request=("${request[@]}")
          if [[ -n "${TELEGRAM_MESSAGE_THREAD_ID:-}" ]]; then
            send_request+=(--data-urlencode "message_thread_id=$TELEGRAM_MESSAGE_THREAD_ID")
          fi

          response="$RUNNER_TEMP/telegram-response.json"
          telegram_url="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
          if curl "${send_request[@]}" --output "$response" "$telegram_url"; then
            exit 0
          fi

          description="$(jq -r '.description // empty' "$response" 2>/dev/null || true)"
          if [[ -n "${TELEGRAM_MESSAGE_THREAD_ID:-}" ]]; then
            echo "::warning::Telegram topic notification failed: ${description:-no API description}; retrying without message_thread_id"
            if curl "${request[@]}" --output "$response" "$telegram_url"; then
              exit 0
            fi
            description="$(jq -r '.description // empty' "$response" 2>/dev/null || true)"
          fi
          echo "::warning::Telegram notification failed: ${description:-no API description}"
          exit 0
